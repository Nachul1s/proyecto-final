      <style>
        .titulo {
            text-align: center;
            padding: 2rem 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 2rem;
        }
        
        .titulo h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0;
        }
        
        .titulo strong {
            color: #ffd700;
        }
        
        .carousel-container {
            max-width: 800px;
            margin: 0 auto 3rem;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .carousel-slides {
            display: flex;
            width: 300%;
            height: 450px;
            transition: transform 0.6s ease-in-out;
        }
        
        .carousel-slide {
            width: 33.333%;
            flex-shrink: 0;
        }
        
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Ocultar inputs radio */
        .carousel-radio {
            display: none;
        }
        
        /* Navegación con labels */
        .carousel-nav {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
        }
        
        .carousel-nav label {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        /* Controles de navegación - AHORA SIEMPRE VISIBLES */
        .carousel-controls {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 5;
            pointer-events: none;
        }
        
        .carousel-control {
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            opacity: 1; /* SIEMPRE VISIBLE */
            pointer-events: all;
        }
        
        .carousel-control:hover {
            background-color: white;
            transform: scale(1.1);
        }
        
        .carousel-control svg {
            width: 24px;
            height: 24px;
            fill: #333;
        }
        
        /* Lógica del carrusel con CSS */
        #slide1:checked ~ .carousel-slides {
            transform: translateX(0%);
        }
        
        #slide2:checked ~ .carousel-slides {
            transform: translateX(-33.333%);
        }
        
        #slide3:checked ~ .carousel-slides {
            transform: translateX(-66.666%);
        }
        
        /* Indicadores activos */
        #slide1:checked ~ .carousel-nav label[for="slide1"],
        #slide2:checked ~ .carousel-nav label[for="slide2"],
        #slide3:checked ~ .carousel-nav label[for="slide3"] {
            background-color: white;
            transform: scale(1.2);
        }
        
        /* Mostrar solo el control correcto para cada slide */
        .carousel-controls > * {
            display: none;
        }
        
        /* CORREGIDO: Flecha IZQUIERDA va al slide ANTERIOR */
        #slide1:checked ~ .carousel-controls .prev3,  /* Del slide 1 al 3 (circular) */
        #slide2:checked ~ .carousel-controls .prev1,  /* Del slide 2 al 1 */
        #slide3:checked ~ .carousel-controls .prev2,  /* Del slide 3 al 2 */
        
        /* CORREGIDO: Flecha DERECHA va al slide SIGUIENTE */
        #slide1:checked ~ .carousel-controls .next2,  /* Del slide 1 al 2 */
        #slide2:checked ~ .carousel-controls .next3,  /* Del slide 2 al 3 */
        #slide3:checked ~ .carousel-controls .next1 { /* Del slide 3 al 1 (circular) */
            display: flex;
        }
        
        /* Secciones de productos */
        .hombre, .mujeres, .boca {
            padding: 2rem 0;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        
        .hombre h2, .mujeres h2, .boca h2 {
            color: #333;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        
        /* Estilos responsivos */
        @media (max-width: 768px) {
            .carousel-slides {
                height: 350px;
            }
            
            .carousel-control {
                width: 40px;
                height: 40px;
            }
            
            .titulo h1 {
                font-size: 2rem;
            }
        }
    </style>
